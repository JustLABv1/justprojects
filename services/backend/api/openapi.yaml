        color: { type: string }
    StatusRequest:
      type: object
      properties:
        name: { type: string }
        category: { $ref: '#/components/schemas/StatusCategory' }
        color: { type: string }
        position: { type: integer }
    Task:
      type: object
      required: [id, tenantId, projectId, statusId, title, priority, visibility, version]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        milestoneId: { type: string, format: uuid, nullable: true }
