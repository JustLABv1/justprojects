        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        externalLinkId: { type: string, format: uuid }
        field: { type: string }
        localValue: {}
        remoteValue: {}
        localChangedAt: { type: string, format: date-time }
        remoteChangedAt: { type: string, format: date-time }
        deliveryId: { type: string }
        status: { type: string, enum: [open, resolved, ignored] }
        resolution: { type: string }
    ConflictList:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/SyncConflict' } }, count: { type: integer } }
    SyncEvent:
      type: object
      required: [id, provider, deliveryId, eventName, payload, status]
