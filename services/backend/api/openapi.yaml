    AuditEvent:
      type: object
      required: [id, tenantId, action, entityType, entityId, metadata]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        actorId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AuditEventList:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }, count: { type: integer } }
    PermissionGrant:
      type: object
      required: [id, tenantId, userId, permission, effect]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        projectId: { type: string, format: uuid, nullable: true }
        permission: { type: string }
        effect: { type: string, enum: [allow, deny] }
    PermissionGrantRequest:
      type: object
      required: [userId, permission]
      properties:
        userId: { type: string, format: uuid }
        projectId: { type: string, format: uuid, nullable: true }
        permission: { type: string }
        effect: { type: string, enum: [allow, deny], default: allow }
    PermissionGrantList:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/PermissionGrant' } }, count: { type: integer } }
    GitHubUserMapping:
      type: object
      required: [id, tenantId, githubLogin, userId]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        githubLogin: { type: string }
        userId: { type: string, format: uuid }
    GitHubUserMappingRequest:
      type: object
      required: [githubLogin, userId]
      properties:
        githubLogin: { type: string }
        userId: { type: string, format: uuid }
    GitHubUserMappingList:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/GitHubUserMapping' } }, count: { type: integer } }
