name: justprojects

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: justprojects
      POSTGRES_USER: justprojects
      POSTGRES_PASSWORD: justprojects
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 uses a versioned data directory below this mount.
      # Existing PostgreSQL 16 volumes must be migrated before switching.
      - justprojects-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justprojects -d justprojects"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    environment:
      DATABASE_SERVER: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: justprojects
      DATABASE_USER: justprojects
      DATABASE_PASSWORD: justprojects
      DATABASE_SSLMODE: disable
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:3000
      SECURE_COOKIES: "false"
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-local-development-key}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command: ["/app/worker"]
    environment:
      DATABASE_SERVER: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: justprojects
      DATABASE_USER: justprojects
      DATABASE_PASSWORD: justprojects
      DATABASE_SSLMODE: disable
      WORKER_POLL_INTERVAL: 2s
      GIT_SYNC_INTERVAL: ${GIT_SYNC_INTERVAL:-5m}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-local-development-key}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  justprojects-postgres:
