name: justprojects

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: justprojects
      POSTGRES_USER: justprojects
      POSTGRES_PASSWORD: justprojects
    ports:
      - "5432:5432"
    volumes:
      - justprojects-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justprojects -d justprojects"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    environment:
      DATABASE_URL: postgres://justprojects:justprojects@postgres:5432/justprojects?sslmode=disable
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:3000
      SECURE_COOKIES: "false"
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-local-development-key}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://justprojects:justprojects@postgres:5432/justprojects?sslmode=disable
      WORKER_POLL_INTERVAL: 2s
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-local-development-key}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  justprojects-postgres:
