name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.1.0 or v0.1.0-beta.1
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/justlabv1/justprojects

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Invalid release version: $INPUT_VERSION" >&2
            echo "Expected v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi

          if [[ "$version" == *-beta.* ]]; then
            channel=beta
            prerelease=true
          else
            channel=latest
            prerelease=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  verify-backend:
    name: Verify backend
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum

      - name: Check formatting
        working-directory: services/backend
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "$files"
            exit 1
          fi

      - name: Vet and test
        working-directory: services/backend
        run: |
          go vet ./...
          go test ./...

      - name: Build API and worker
        working-directory: services/backend
        run: go build ./...

  verify-frontend:
    name: Verify frontend
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: pnpm
          cache-dependency-path: services/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: services/frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck and lint
        working-directory: services/frontend
        run: |
          pnpm typecheck
          pnpm lint

      - name: Build
        working-directory: services/frontend
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build-backend:
    name: Build & Push Backend
    needs: [prepare, verify-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=backend-${{ needs.prepare.outputs.version }}
            type=raw,value=backend-${{ needs.prepare.outputs.channel }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          provenance: mode=max
          sbom: true

  build-frontend:
    name: Build & Push Frontend
    needs: [prepare, verify-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=frontend-${{ needs.prepare.outputs.version }}
            type=raw,value=frontend-${{ needs.prepare.outputs.channel }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: services/frontend
          file: services/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            NEXT_PUBLIC_API_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          provenance: mode=max
          sbom: true

  release-artifacts:
    name: Build release binaries
    needs: [prepare, verify-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum

      - name: Build API and worker bundles
        working-directory: services/backend
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            bundle="justprojects-${RELEASE_VERSION}-linux-${arch}"
            mkdir -p "dist/${bundle}"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/${bundle}/justprojects-api" .
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/${bundle}/justprojects-worker" ./cmd/worker
            cp -R internal/db/migrations "dist/${bundle}/migrations"
            tar -czf "dist/${bundle}.tar.gz" -C dist "$bundle"
            rm -rf "dist/${bundle}"
          done
          (cd dist && sha256sum justprojects-*.tar.gz > checksums.txt)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: services/backend/dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, verify-backend, verify-frontend, build-backend, build-frontend, release-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: dist

      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          name: Release ${{ needs.prepare.outputs.tag }}
          tag: ${{ needs.prepare.outputs.tag }}
          commit: ${{ github.sha }}
          skipIfReleaseExists: true
          generateReleaseNotes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          artifacts: dist/*
          artifactErrorsFailBuild: true
