name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Format, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum

      - name: Check formatting
        working-directory: services/backend
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "These Go files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        working-directory: services/backend
        run: go vet ./...

      - name: Test
        working-directory: services/backend
        run: go test ./...

      - name: Build API and worker
        working-directory: services/backend
        run: go build ./...

  frontend:
    name: Frontend — Typecheck, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: pnpm
          cache-dependency-path: services/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: services/frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: services/frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: services/frontend
        run: pnpm lint

      - name: Build
        working-directory: services/frontend
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend-image:
    name: Backend — Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
