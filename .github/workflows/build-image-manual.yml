name: Build Image (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or ref to build and push
        required: true
        default: main
        type: string

concurrency:
  group: manual-image-${{ inputs.branch }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/justlabv1/justprojects

jobs:
  build:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branch }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: vars
        shell: bash
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          tag="$(printf '%s' "$INPUT_BRANCH" | sed -E 's/[^a-zA-Z0-9_.-]+/-/g; s/^-+//; s/-+$//')"
          if [[ -z "$tag" ]]; then
            echo "Could not derive a valid image tag from: $INPUT_BRANCH" >&2
            exit 1
          fi
          echo "tag=manual-${tag}" >> "$GITHUB_OUTPUT"
          echo "version=manual-${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
